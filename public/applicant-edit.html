<!doctype html>
<html lang="en">
  <head>
    <script src="analytics.js"></script>
    <script src="api-base.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Your Application</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --text-main: rgba(255,255,255,0.97);
        --text-soft: rgba(239,245,255,0.92);
        --text-muted: rgba(228,237,255,0.78);
        --gold: #efc352;
        --gold-deep: #d9a230;
        --panel-strong-1: rgba(13, 62, 164, 0.70);
        --panel-strong-2: rgba(7, 50, 145, 0.82);
        --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0; font-family: var(--font); color: var(--text-main);
        background: url('assets/banking-background.jpg') center center / cover no-repeat fixed;
        text-shadow: 0 1px 2px rgba(0,0,0,0.14); position: relative; overflow-x: hidden;
      }
      .page { min-height: 100vh; padding: 18px; position: relative; z-index: 1; }
      .container {
        max-width: 860px; margin: 32px auto 0;
        background: linear-gradient(135deg, rgba(5, 48, 132, 0.78) 0%, rgba(31, 91, 190, 0.48) 45%, rgba(105, 151, 226, 0.26) 100%);
        border: 1px solid rgba(255,255,255,0.26); border-radius: 24px; padding: 24px 26px 26px;
        backdrop-filter: blur(10px) saturate(115%); -webkit-backdrop-filter: blur(10px) saturate(115%);
        box-shadow: 0 22px 50px rgba(3, 25, 89, 0.20); position: relative; overflow: hidden;
      }
      .container::before { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,0.20); pointer-events: none; }

      .top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; position: relative; z-index: 2; }
      .page-title { font-size: 24px; font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
      .page-title i { color: var(--gold); }
      .page-subtitle { color: var(--text-soft); font-size: 14px; margin: 0; }
      .user-info { display: flex; gap: 14px; flex-wrap: wrap; }
      .nav-btn, .btn {
        border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; text-decoration: none; cursor: pointer;
        transition: all .18s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        line-height: 1; font-family: inherit;
      }
      .nav-btn {
        padding: 12px 18px; background: rgba(13, 62, 164, 0.70); border-color: rgba(205, 226, 255, 0.20);
        backdrop-filter: blur(4px); color: var(--text-main); font-size: 13px; font-weight: 600;
      }
      .btn { padding: 13px 20px; background: rgba(13, 62, 164, 0.70); border-color: rgba(205, 226, 255, 0.20); color: var(--text-main); font-size: 14px; font-weight: 600; }
      .btn.primary, .btn[type="submit"] { background: linear-gradient(180deg, #f1c75a, #dfa938); color: #172033; border-color: rgba(255,255,255,0.18); box-shadow: 0 8px 18px rgba(96, 65, 8, 0.18); }
      .nav-btn:hover, .btn:hover { transform: translateY(-1px); }

      .card {
        background: transparent; border-radius: 18px; padding: 20px; border: 1px solid rgba(190, 218, 255, 0.20);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); margin-bottom: 18px; position: relative; z-index: 2;
      }
      .card-title { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.12); font-size: 18px; font-weight: 600; }
      .card-title i { color: var(--gold); }

      #status-area { position: relative; z-index: 2; }
      #status-area:not(:empty) {
        border-radius: 12px; padding: 14px 16px; font-size: 14px; margin-bottom: 18px;
        background: rgba(243, 156, 18, 0.18); border: 1px solid rgba(243,156,18,0.4); color: #ffcb51;
      }

      .promo-card-info {
        background: rgba(13, 62, 164, 0.55); border: 1px solid rgba(165, 203, 255, 0.22);
        border-left: 2px solid rgba(239, 195, 82, 0.86); border-radius: 12px; padding: 16px 18px;
      }
      .promo-card-info h3 { margin: 0 0 10px; font-size: 15px; color: var(--gold); }
      .promo-card-info p { margin: 4px 0; font-size: 14px; color: var(--text-soft); }

      .field-row { margin-bottom: 14px; }
      .field-row label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px; }
      .field-row input, .field-row select, #messages-container textarea {
        width: 100%; padding: 12px 14px; border-radius: 10px; font-family: inherit; font-size: 15px;
        background: rgba(13, 62, 164, 0.60); border: 1px solid rgba(165, 203, 255, 0.24); color: var(--text-main);
      }
      .field-row input:focus, .field-row select:focus, #messages-container textarea:focus { outline: none; border-color: rgba(239, 195, 82, 0.60); }
      .field-row select option { background: #0d3ea4; color: #fff; }
      .field-row.flagged input, .field-row.flagged select { border-color: rgba(243, 156, 18, 0.75); box-shadow: 0 0 0 2px rgba(243, 156, 18, 0.18); }
      .field-row.flagged label::after { content: ' — needs your attention'; color: #ffcb51; text-transform: none; letter-spacing: normal; }
      .phone-group { display: flex; gap: 10px; }
      .phone-group select { width: 96px; flex: 0 0 96px; }

      .upload-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 7px; }
      input[type="file"] { width: 100%; padding: 10px; border-radius: 10px; background: rgba(13, 62, 164, 0.45); border: 1px dashed rgba(165, 203, 255, 0.35); color: var(--text-soft); font-size: 13px; font-family: inherit; }
      .attachment-item {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        background: rgba(13, 62, 164, 0.45); border: 1px solid rgba(165, 203, 255, 0.22);
        border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px;
      }
      .attachment-item a { color: var(--gold); text-decoration: none; font-weight: 600; word-break: break-all; }
      .remove-attachment {
        background: rgba(192, 57, 43, 0.24); color: #ff9a9a; border: 1px solid rgba(192,57,43,0.4);
        border-radius: 8px; padding: 7px 12px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
      }
      .remove-attachment:hover { background: rgba(192, 57, 43, 0.4); }

      #messages-list { list-style: none; margin: 0 0 14px; padding: 0; }
      #messages-list li {
        background: rgba(13, 62, 164, 0.45); border: 1px solid rgba(165, 203, 255, 0.18);
        border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; color: var(--text-soft);
      }
      #messages-container label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px; }
      #send-message-btn {
        margin-top: 10px; padding: 11px 18px; border-radius: 12px; cursor: pointer; font-family: inherit;
        background: rgba(13, 62, 164, 0.70); border: 1px solid rgba(205, 226, 255, 0.20); color: var(--text-main); font-size: 13px; font-weight: 600;
      }
      #send-message-btn:hover { transform: translateY(-1px); }

      .form-actions { display: flex; gap: 12px; flex-wrap: wrap; position: relative; z-index: 2; }

      footer { text-align: center; padding-top: 20px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); color: rgba(234,243,255,0.84); font-size: 13px; position: relative; z-index: 2; }
      footer a { color: var(--gold); text-decoration: none; font-weight: 600; }
      footer p { margin: 6px 0; }

      @media (max-width: 768px) {
        .top-bar { flex-direction: column; align-items: center; text-align: center; }
        .user-info { justify-content: center; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="container">
        <div class="top-bar">
          <div>
            <h1 class="page-title"><i class="fas fa-edit"></i> Edit Your Application</h1>
            <p class="page-subtitle">Update flagged details, manage attachments, and message our team</p>
          </div>
          <div class="user-info">
            <a href="status.html" class="nav-btn" id="status-page-link"><i class="fas fa-info-circle"></i> Status</a>
            <a href="index.html" class="nav-btn" id="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
          </div>
        </div>

        <div id="status-area"></div>

        <form id="applicant-form" style="display:none;">
          <input type="hidden" name="id">

          <div id="promo-info" class="card" style="padding: 0; border: 0; box-shadow: none;"></div>

          <div class="card">
            <div class="card-title"><i class="fas fa-user"></i> Your Details</div>
            <div id="flagged-container"></div>
          </div>

          <div class="card">
            <div class="card-title"><i class="fas fa-paperclip"></i> Attachments</div>
            <div id="existing-attachments"></div>
            <label class="upload-label" for="photoId">Upload Photo ID</label>
            <input type="file" id="photoId" accept="image/*">
            <label class="upload-label" for="payslips">Upload Payslips</label>
            <input type="file" id="payslips" multiple accept="application/pdf,image/*">
          </div>

          <div class="card">
            <div class="card-title"><i class="fas fa-envelope"></i> Mailbox</div>
            <div id="messages-container">
              <ul id="messages-list"></ul>
              <label for="message-body">New Message</label>
              <textarea id="message-body" rows="2"></textarea>
              <button type="button" id="send-message-btn"><i class="fas fa-paper-plane"></i> Send Message</button>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn"><i class="fas fa-save"></i> Save Changes</button>
            <a href="index.html" class="btn back-btn" style="background: rgba(255,255,255,0.10);"><i class="fas fa-times"></i> Cancel</a>
          </div>
        </form>

        <footer>
          <p>Technology by <a href="https://doxservices.com" target="_blank" rel="noopener noreferrer">Doxservices</a>.</p>
          <p><i class="fas fa-lock"></i> Your data is protected with bank-level security</p>
        </footer>
      </div>
    </div>

    <script>
      // Load parishes for dropdown
      let parishesList = [];
      async function loadParishes() {
        try {
          const res = await fetch(window.LOANIT_API_BASE + '/api/parishes');
          parishesList = await res.json();
        } catch (err) {
          console.error('Error loading parishes', err);
        }
      }
      // We will call loadParishes when needed before rendering selects

      // Map of field labels
      const fieldLabels = {
        firstName: 'First Name',
        lastName: 'Last Name',
        email: 'Email',
        phone: 'Phone',
        trn: 'TRN',
        addressLine1: 'Address Line 1',
        addressLine2: 'Address Line 2',
        parish: 'Parish'
      };

      // Get TRN from query parameters
      const params = new URLSearchParams(window.location.search);
      const trn = params.get('trn');

      const statusArea = document.getElementById('status-area');
      const form = document.getElementById('applicant-form');
      const flaggedContainer = document.getElementById('flagged-container');

      async function loadApplication() {
        if (!trn) {
          statusArea.textContent = 'No TRN provided. Follow the link from your status page to edit your application.';
          return;
        }
        try {
          const res = await fetch(window.LOANIT_API_BASE + '/api/applications/trn/' + encodeURIComponent(trn));
          if (!res.ok) {
            statusArea.textContent = 'No application found for this TRN';
            return;
          }
          const app = await res.json();
          // Ensure parishes are loaded before building selects
          if (parishesList.length === 0) {
            await loadParishes();
          }
          form.elements.id.value = app.id;
          const flags = app.reviewFlags || {};
          const applicant = app.applicant || {};
          // Display status and reason to guide the applicant
          const statusHTML = [];
          if (app.status) statusHTML.push('<strong>Status:</strong> ' + app.status);
          if (app.reason) statusHTML.push('<strong>Reason:</strong> ' + (app.reason || ''));
          if (statusHTML.length > 0) {
            statusArea.innerHTML = statusHTML.join('<br>');
          }
          // Display promotion details
          const promoInfoDiv = document.getElementById('promo-info');
          if (app.promoSnapshot) {
            const promo = app.promoSnapshot;
            let termsText = '';
            if (promo.termMode === 'fixed') {
              termsText = `${promo.fixedTermMonths} month` + (promo.fixedTermMonths > 1 ? 's' : '');
            } else if (Array.isArray(promo.allowedTerms) && promo.allowedTerms.length) {
              termsText = promo.allowedTerms.join(', ') + ' months';
            }
            promoInfoDiv.innerHTML = `
              <div class="promo-card-info">
                <h3>Loan Terms</h3>
                <p><strong>Name:</strong> ${promo.name}</p>
                <p><strong>Principal:</strong> ${promo.currency || ''} ${promo.principal?.toLocaleString() || ''}</p>
                <p><strong>Interest:</strong> ${promo.monthlyInterestPct}% monthly</p>
                <p><strong>Terms:</strong> ${termsText}</p>
              </div>`;
          } else {
            promoInfoDiv.innerHTML = '';
          }

          // Build rows for all applicant fields; highlight flagged ones
          flaggedContainer.innerHTML = '';
          Object.keys(applicant).forEach(key => {
            const row = document.createElement('div');
            row.className = 'field-row';
            if (flags[key]) {
              row.classList.add('flagged');
            }
            const lbl = document.createElement('label');
            lbl.textContent = fieldLabels[key] || key;
            lbl.htmlFor = 'edit-' + key;
            // Special phone input: area code + number
            if (key === 'phone') {
              const group = document.createElement('div');
              group.className = 'phone-group';
              const areaSelect = document.createElement('select');
              areaSelect.name = 'phone-area';
              areaSelect.id = 'edit-phone-area';
              ['876','658'].forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = code;
                areaSelect.appendChild(opt);
              });
              const numberInput = document.createElement('input');
              numberInput.type = 'text';
              numberInput.name = 'phone-number';
              numberInput.id = 'edit-phone-number';
              numberInput.pattern = '\\d{7}';
              numberInput.maxLength = 7;
              let area = '876';
              let num = '';
              if (applicant.phone) {
                const parts = applicant.phone.split('-');
                if (parts.length === 3) {
                  area = parts[1];
                  num = parts[2];
                }
              }
              areaSelect.value = area;
              numberInput.value = num;
              group.appendChild(areaSelect);
              group.appendChild(numberInput);
              row.appendChild(lbl);
              row.appendChild(group);
              flaggedContainer.appendChild(row);
              return;
            }
            // Parish dropdown
            if (key === 'parish') {
              const select = document.createElement('select');
              select.name = 'parish';
              select.id = 'edit-parish';
              parishesList.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                select.appendChild(opt);
              });
              select.value = applicant.parish || '';
              row.appendChild(lbl);
              row.appendChild(select);
              flaggedContainer.appendChild(row);
              return;
            }
            // Default input
            const input = document.createElement('input');
            input.type = 'text';
            input.name = key;
            input.id = 'edit-' + key;
            input.value = applicant[key] || '';
            row.appendChild(lbl);
            row.appendChild(input);
            flaggedContainer.appendChild(row);
          });
          // Display existing attachments with remove buttons
          const attachmentsDiv = document.getElementById('existing-attachments');
          attachmentsDiv.innerHTML = '';
          const attachments = app.attachments || {};
          // Show photo ID
          if (attachments.photoId) {
            const div = document.createElement('div');
            div.className = 'attachment-item';
            const fileName = attachments.photoId.split('/').pop();
            const a = document.createElement('a');
            a.href = attachments.photoId;
            a.textContent = fileName || 'Photo ID';
            a.target = '_blank';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'remove-attachment';
            btn.dataset.type = 'photoId';
            btn.textContent = 'Remove';
            div.appendChild(a);
            div.appendChild(btn);
            attachmentsDiv.appendChild(div);
          }
          // Show payslips
          if (Array.isArray(attachments.payslips)) {
            attachments.payslips.forEach((url, index) => {
              const div = document.createElement('div');
              div.className = 'attachment-item';
              const fileName = url.split('/').pop();
              const a = document.createElement('a');
              a.href = url;
              a.textContent = fileName || 'Payslip ' + (index + 1);
              a.target = '_blank';
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'remove-attachment';
              btn.dataset.type = 'payslip';
              btn.dataset.url = url;
              btn.textContent = 'Remove';
              div.appendChild(a);
              div.appendChild(btn);
              attachmentsDiv.appendChild(div);
            });
          }
          // Render messages (conversation)
          renderMessages(app.messages || []);
          // Show form once fields are built
          form.style.display = '';
        } catch (err) {
          statusArea.textContent = 'Error fetching application data';
          console.error(err);
        }
      }

      // Helper to convert a File to a data URI string
      function readFileAsDataURI(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      // Render messages list
      function renderMessages(msgs) {
        const list = document.getElementById('messages-list');
        list.innerHTML = '';
        msgs.forEach(msg => {
          const li = document.createElement('li');
          const time = new Date(msg.timestamp).toLocaleString();
          li.textContent = `[${msg.role}] ${time}: ${msg.text}`;
          list.appendChild(li);
        });
      }

      // Handle sending new message
      document.getElementById('send-message-btn').addEventListener('click', async () => {
        const bodyEl = document.getElementById('message-body');
        const text = bodyEl.value.trim();
        if (!text) return;
        const appId = form.elements.id.value;
        try {
          const res = await fetch(window.LOANIT_API_BASE + '/api/applications/' + appId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ newMessage: { role: 'applicant', text } })
          });
          if (res.ok) {
            const updated = await res.json();
            renderMessages(updated.messages || []);
            bodyEl.value = '';
          } else {
            alert('Error sending message');
          }
        } catch (err) {
          console.error('Error sending message', err);
        }
      });

      // Handle submit
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const appId = form.elements.id.value;
        const updatedApplicant = {};
        // Collect updated values
        flaggedContainer.querySelectorAll('input, select').forEach(el => {
          if (el.name === 'phone-area' || el.name === 'phone-number') return;
          // Skip attachments fields (handled separately)
          if (el.name === 'parish' || el.name === 'phone' || el.id === 'edit-parish') {
            updatedApplicant[el.name] = el.value;
          } else {
            updatedApplicant[el.name] = el.value;
          }
        });
        // Build phone if present
        const areaEl = flaggedContainer.querySelector('select[name="phone-area"]');
        const numberEl = flaggedContainer.querySelector('input[name="phone-number"]');
        if (areaEl && numberEl) {
          updatedApplicant.phone = '1-' + areaEl.value + '-' + numberEl.value;
        }
        // Build attachments from file inputs
        const attachments = {};
        const photoEl = document.getElementById('photoId');
        const payslipEl = document.getElementById('payslips');
        if (photoEl && photoEl.files && photoEl.files[0]) {
          const file = photoEl.files[0];
          const dataUri = await readFileAsDataURI(file);
          attachments.photoId = { name: file.name, type: file.type, data: dataUri };
        }
        if (payslipEl && payslipEl.files && payslipEl.files.length > 0) {
          attachments.payslips = [];
          for (const file of payslipEl.files) {
            const dataUri = await readFileAsDataURI(file);
            attachments.payslips.push({ name: file.name, type: file.type, data: dataUri });
          }
        }
        // Clear review flags after update (applicant completions)
        const reviewFlags = {};
        // Build payload; include attachments only if any were uploaded
        const payload = { applicant: updatedApplicant, reviewFlags };
        if (Object.keys(attachments).length > 0) {
          payload.attachments = attachments;
        }
        try {
          const res = await fetch(window.LOANIT_API_BASE + '/api/applications/' + appId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            statusArea.textContent = 'Your information has been updated successfully.';
            form.style.display = 'none';
          } else {
            statusArea.textContent = 'Error updating application.';
          }
        } catch (err) {
          statusArea.textContent = 'Error updating application.';
          console.error(err);
        }
      });

      // Handle removal of attachments
      document.getElementById('existing-attachments').addEventListener('click', async (ev) => {
        const target = ev.target;
        if (!target.classList.contains('remove-attachment')) return;
        const type = target.dataset.type;
        const appId = form.elements.id.value;
        const removePayload = { removeAttachments: {} };
        if (type === 'photoId') {
          removePayload.removeAttachments.photoId = true;
        } else if (type === 'payslip') {
          const url = target.dataset.url;
          removePayload.removeAttachments.payslips = [url];
        }
        try {
          const res = await fetch(window.LOANIT_API_BASE + '/api/applications/' + appId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(removePayload)
          });
          if (res.ok) {
            // Reload application data to refresh attachments list
            loadApplication();
          } else {
            alert('Error removing attachment');
          }
        } catch (err) {
          console.error('Error removing attachment', err);
        }
      });

      // On load, fetch application data
      loadApplication();
    </script>
  </body>
</html>
