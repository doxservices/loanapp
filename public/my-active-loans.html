<!DOCTYPE html>
<html lang="en">
<head>
  <script src="analytics.js"></script>
  <script src="api-base.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Active Loans</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --text-main: rgba(255,255,255,0.97);
      --text-soft: rgba(239,245,255,0.92);
      --text-muted: rgba(228,237,255,0.78);
      --gold: #efc352;
      --gold-deep: #d9a230;
      --panel-strong-1: rgba(13, 62, 164, 0.70);
      --panel-strong-2: rgba(7, 50, 145, 0.82);
      --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; font-family: var(--font); color: var(--text-main);
      background: url('assets/banking-background.jpg') center center / cover no-repeat fixed;
      text-shadow: 0 1px 2px rgba(0,0,0,0.14); position: relative; overflow-x: hidden;
    }
    .page { min-height: 100vh; padding: 18px; position: relative; z-index: 1; }
    .container {
      max-width: 1040px; margin: 32px auto 0;
      background: linear-gradient(135deg, rgba(5, 48, 132, 0.78) 0%, rgba(31, 91, 190, 0.48) 45%, rgba(105, 151, 226, 0.26) 100%);
      border: 1px solid rgba(255,255,255,0.26); border-radius: 24px; padding: 24px 26px 26px;
      backdrop-filter: blur(10px) saturate(115%); -webkit-backdrop-filter: blur(10px) saturate(115%);
      box-shadow: 0 22px 50px rgba(3, 25, 89, 0.20); position: relative; overflow: hidden;
    }
    .container::before { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,0.20); pointer-events: none; }

    .top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; position: relative; z-index: 2; }
    .page-title { font-size: 24px; font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
    .page-title i { color: var(--gold); }
    .page-subtitle { color: var(--text-soft); font-size: 14px; margin: 0; }
    .user-info { display: flex; gap: 14px; flex-wrap: wrap; }
    .nav-btn, .btn {
      border: 1px solid rgba(255,255,255,0.16); border-radius: 12px; text-decoration: none; cursor: pointer;
      transition: all .18s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      line-height: 1; font-family: inherit;
    }
    .nav-btn {
      padding: 12px 18px; background: rgba(13, 62, 164, 0.70); border-color: rgba(205, 226, 255, 0.20);
      backdrop-filter: blur(4px); color: var(--text-main); font-size: 13px; font-weight: 600;
    }
    .btn { padding: 11px 16px; background: rgba(13, 62, 164, 0.70); border-color: rgba(205, 226, 255, 0.20); color: var(--text-main); font-size: 13px; font-weight: 600; }
    .btn-primary { background: linear-gradient(180deg, #f1c75a, #dfa938); color: #172033; border-color: rgba(255,255,255,0.18); box-shadow: 0 8px 18px rgba(96, 65, 8, 0.18); }
    .nav-btn:hover, .btn:hover { transform: translateY(-1px); }

    .loans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; position: relative; z-index: 2; }
    .loan-card {
      background: linear-gradient(180deg, var(--panel-strong-1), var(--panel-strong-2));
      border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 20px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 14px;
    }
    .loan-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); }
    .loan-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .loan-type { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
    .loan-code { font-size: 12px; color: var(--text-muted); }
    .status-badge { padding: 5px 11px; border-radius: 6px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; text-transform: capitalize; white-space: nowrap; }
    .status-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status-approved, .status-completed { background: rgba(39, 174, 96, 0.22); color: #8deebc; }
    .status-pending, .status-submitted { background: rgba(243, 156, 18, 0.22); color: #ffcb51; }
    .status-rejected { background: rgba(192, 57, 43, 0.22); color: #ff9a9a; }

    .loan-figures { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .figure h4 { margin: 0 0 4px; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); }
    .figure div { font-size: 15px; font-weight: 600; }
    .figure.balance div { color: var(--gold); }

    .progress-wrap { background: rgba(0,0,0,0.25); border-radius: 999px; height: 9px; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width .4s ease; }
    .progress-label { font-size: 12px; color: var(--text-soft); margin-top: 6px; }

    .loan-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }

    .empty-state { text-align: center; padding: 46px 15px; color: var(--text-soft); position: relative; z-index: 2; }
    .empty-state i { font-size: 40px; margin-bottom: 12px; color: var(--gold); }

    footer { text-align: center; padding-top: 20px; margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); color: rgba(234,243,255,0.84); font-size: 13px; position: relative; z-index: 2; }
    footer a { color: var(--gold); text-decoration: none; font-weight: 600; }
    footer p { margin: 6px 0; }

    @media (max-width: 768px) {
      .top-bar { flex-direction: column; align-items: center; text-align: center; }
      .user-info { justify-content: center; }
      .loans-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <div class="top-bar">
        <div>
          <h1 class="page-title"><i class="fas fa-list"></i> My Active Loans</h1>
          <p class="page-subtitle">Track balances and progress on all your Loan It Financing loans</p>
        </div>
        <div class="user-info">
          <a href="make-a-payment.html" class="nav-btn"><i class="fas fa-money-check-alt"></i> Make a Payment</a>
          <a href="user-profile.html" class="nav-btn"><i class="fas fa-id-card"></i> My Profile</a>
        </div>
      </div>

      <div class="loans-grid" id="loans-grid"></div>
      <div class="empty-state" id="loading-state"><i class="fas fa-spinner fa-spin"></i><h3>Loading your loans…</h3></div>

      <footer>
        <p>Technology by <a href="https://doxservices.com" target="_blank" rel="noopener noreferrer">Doxservices</a>.</p>
        <p><i class="fas fa-lock"></i> Your data is protected with bank-level security</p>
      </footer>
    </div>
  </div>

  <script>
    const PROFILE_EMAIL = 'alex.j@example.com'; // demo profile identity (dummy data)
    const API = window.LOANIT_API_BASE;
    const fmt = n => 'JMD ' + Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
    const esc = s => (s ?? '').toString().replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');

    function statusClassOf(status) {
      const s = (status || '').toLowerCase();
      if (['approved', 'completed', 'rejected', 'submitted'].includes(s)) return 'status-' + s;
      return 'status-pending';
    }

    // Flat add-on interest, matching the promotion model used app-wide.
    function loanTotals(loan) {
      const rate = Number(loan.monthlyInterestPct) || 0;
      const total = loan.principal + loan.principal * (rate / 100) * loan.termMonths;
      return { total, monthly: total / loan.termMonths };
    }

    async function load() {
      const grid = document.getElementById('loans-grid');
      const loading = document.getElementById('loading-state');
      try {
        const [loansRes, paymentsRes] = await Promise.all([
          fetch(API + '/api/loans?email=' + encodeURIComponent(PROFILE_EMAIL)),
          fetch(API + '/api/payments?email=' + encodeURIComponent(PROFILE_EMAIL))
        ]);
        const loans = await loansRes.json();
        const payments = await paymentsRes.json();
        loading.style.display = 'none';

        if (!loans.length) {
          grid.innerHTML = '';
          loading.outerHTML = '<div class="empty-state"><i class="fas fa-folder-open"></i><h3>No loans on record</h3><p>Apply for a loan to get started.</p></div>';
          return;
        }

        grid.innerHTML = loans.map(loan => {
          const { total, monthly } = loanTotals(loan);
          const paid = payments.filter(p => p.loanId === loan.id).reduce((s, p) => s + (Number(p.amount) || 0), 0);
          const completed = (loan.status || '').toLowerCase() === 'completed';
          const balance = completed ? 0 : Math.max(0, total - paid);
          const pct = completed ? 100 : Math.min(100, Math.round((paid / total) * 100));
          const canPay = !completed && (loan.status || '').toLowerCase() !== 'rejected';
          return `
            <div class="loan-card">
              <div class="loan-head">
                <div>
                  <h3 class="loan-type">${esc(loan.loanType)}</h3>
                  <div class="loan-code">${esc(loan.applicationCode)}</div>
                </div>
                <span class="status-badge ${statusClassOf(loan.status)}">${esc(loan.status)}</span>
              </div>
              <div class="loan-figures">
                <div class="figure"><h4>Principal</h4><div>${fmt(loan.principal)}</div></div>
                <div class="figure"><h4>Term</h4><div>${esc(loan.termMonths)} months</div></div>
                <div class="figure"><h4>Monthly Payment</h4><div>${fmt(monthly)}</div></div>
                <div class="figure balance"><h4>Balance</h4><div>${fmt(balance)}</div></div>
              </div>
              <div>
                <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
                <div class="progress-label">${pct}% repaid — ${fmt(paid)} of ${fmt(total)}</div>
              </div>
              <div class="loan-actions">
                <a class="btn" href="loan-statement.html?loan=${encodeURIComponent(loan.id)}"><i class="fas fa-file-invoice-dollar"></i> Statement</a>
                ${canPay ? `<a class="btn btn-primary" href="make-a-payment.html?loan=${encodeURIComponent(loan.id)}"><i class="fas fa-money-check-alt"></i> Pay</a>` : ''}
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        loading.innerHTML = '<i class="fas fa-exclamation-triangle"></i><h3>Failed to load loans</h3><p>' + esc(err.message) + '</p>';
      }
    }

    load();
  </script>
</body>
</html>
