<!doctype html>
<html lang="en">
<head>
  <script src="analytics.js"></script>
  <script src="api-base.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="user-auth.js"></script>
  <script src="profile-gate.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support — Loan It Financing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --blue: #0f6fbe; --blue-dark: #0a4f8b; --blue-soft: #f2f8ff; --line: #d6e2ee;
      --ink: #16202a; --muted: #5f7186; --paper: #fff; --screen: #eef3f8;
      --ok: #1d7a53; --ok-bg: #e6f4ed; --wait: #8a6a14; --wait-bg: #fdf6e3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--screen); color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; line-height: 1.55; }
    .bar { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 20px;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .bar h1 { margin: 0; font-size: 18px; color: var(--blue-dark); }
    .bar .who { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 10px; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 22px 20px 60px; }
    .grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
    .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--blue-dark); }
    label { display: block; font-weight: 600; font-size: 13px; margin: 0 0 4px; }
    input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line);
      border-radius: 6px; font: inherit; background: #fff; color: var(--ink); }
    textarea { min-height: 110px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .btn { border: 1px solid var(--blue-dark); background: var(--blue); color: #fff; font: inherit;
      font-weight: 600; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .btn.ghost { background: #fff; color: var(--blue-dark); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li + li { margin-top: 8px; }
    .tkt { width: 100%; text-align: left; background: var(--blue-soft); border: 1px solid var(--line);
      border-radius: 8px; padding: 10px 12px; cursor: pointer; font: inherit; }
    .tkt.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(15,111,190,.14); }
    .tkt .subj { font-weight: 600; display: block; }
    .tkt .meta { color: var(--muted); font-size: 12px; }
    .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 999px; background: var(--blue-soft); color: var(--blue-dark); }
    .pill.resolved { background: var(--ok-bg); color: var(--ok); }
    .pill.waiting { background: var(--wait-bg); color: var(--wait); }
    .msg { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
    .msg.staff { background: var(--blue-soft); border-color: #cfe2f5; }
    .msg .from { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .msg .body { white-space: pre-wrap; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; }
    .signin { max-width: 440px; margin: 60px auto; text-align: center; }
    .status { font-size: 13px; color: var(--muted); min-height: 18px; }
    .about { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="bar">
    <h1><i class="fas fa-life-ring"></i> Support</h1>
    <span class="muted" style="font-size:13px;">Loan It Financing</span>
    <div class="who" id="who"></div>
  </div>

  <div class="wrap">
    <div id="signed-out" class="signin card" hidden>
      <h2>Sign in to open a ticket</h2>
      <p class="muted">Use your Google account. We use it to keep your conversation with us in one place.</p>
      <button class="btn" id="signin-btn"><i class="fab fa-google"></i> Sign in with Google</button>
      <p class="status" id="signin-status"></p>
    </div>

    <div id="signed-in" class="grid" hidden>
      <div>
        <div class="card">
          <h2>Your tickets</h2>
          <ul class="list" id="ticket-list"></ul>
          <p class="empty" id="no-tickets" hidden>Nothing yet. Open your first ticket on the right.</p>
          <p style="margin:14px 0 0;"><button class="btn ghost" id="new-btn">New ticket</button></p>
        </div>
      </div>

      <div>
        <div class="card" id="new-panel">
          <h2>Open a ticket</h2>
          <div class="field">
            <label for="subject">What is it about?</label>
            <input id="subject" maxlength="200" placeholder="A short summary" />
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="normal">Normal</option>
              <option value="high">High — this is urgent</option>
            </select>
          </div>
          <div class="field">
            <label for="message">Tell us what is happening</label>
            <textarea id="message" maxlength="5000" placeholder="Include anything that would help us find your account."></textarea>
          </div>
          <p class="about" id="about-note" hidden></p>
          <button class="btn" id="send-btn">Open ticket</button>
          <p class="status" id="new-status"></p>
        </div>

        <div class="card" id="thread-panel" hidden>
          <h2 id="thread-subject"></h2>
          <p class="muted" id="thread-meta" style="margin:-6px 0 14px; font-size:13px;"></p>
          <div id="thread"></div>
          <div class="field" style="margin-top:14px;">
            <label for="reply">Reply</label>
            <textarea id="reply" maxlength="5000" placeholder="Add to this conversation"></textarea>
          </div>
          <button class="btn" id="reply-btn">Send reply</button>
          <button class="btn ghost" id="back-btn">Back</button>
          <p class="status" id="thread-status"></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const when = v => { try { return new Date(v).toLocaleString(); } catch (e) { return ''; } };
    const pillClass = s => s === 'resolved' ? 'resolved' : (s === 'waiting on customer' ? 'waiting' : '');

    // A ticket raised from a record carries what it is about, e.g.
    // support.html?about=contract:AbC123
    const aboutParam = new URLSearchParams(location.search).get('about') || '';
    const [aboutType, aboutId] = aboutParam.split(':');
    if (aboutType && aboutId) {
      $('about-note').hidden = false;
      $('about-note').textContent = 'This ticket will be linked to your ' +
        ({ contract: 'loan contract', standingOrder: 'standing order',
           salaryDeduction: 'salary deduction', application: 'application' }[aboutType] || 'record') + '.';
    }

    let tickets = [];
    let openId = null;

    function renderList() {
      const ul = $('ticket-list');
      ul.innerHTML = tickets.map(t => `
        <li><button type="button" class="tkt ${t.id === openId ? 'active' : ''}" data-id="${esc(t.id)}">
          <span class="subj">${esc(t.subject)}</span>
          <span class="meta">${esc(when(t.lastReplyAt || t.createdAt))} ·
            <span class="pill ${pillClass(t.status)}">${esc(t.status)}</span></span>
        </button></li>`).join('');
      $('no-tickets').hidden = tickets.length > 0;
    }

    async function load() {
      const res = await window.userAuth.fetch('/api/tickets');
      const json = await res.json();
      tickets = json.ok ? json.tickets : [];
      renderList();
    }

    function showNew() {
      openId = null;
      $('new-panel').hidden = false;
      $('thread-panel').hidden = true;
      renderList();
    }

    async function openTicket(id) {
      const res = await window.userAuth.fetch('/api/tickets/' + encodeURIComponent(id));
      const json = await res.json();
      if (!json.ok) { $('thread-status').textContent = json.error || 'Could not open that ticket.'; return; }
      openId = id;
      const t = json.ticket;
      $('new-panel').hidden = true;
      $('thread-panel').hidden = false;
      $('thread-subject').textContent = t.subject;
      $('thread-meta').innerHTML = `Opened ${esc(when(t.createdAt))} · <span class="pill ${pillClass(t.status)}">${esc(t.status)}</span>` +
        (t.about ? ` · about your ${esc(t.about.type.replace(/([A-Z])/g, ' $1').toLowerCase())}` : '');
      $('thread').innerHTML = json.messages.map(m => `
        <div class="msg ${m.author === 'staff' ? 'staff' : ''}">
          <div class="from">${m.author === 'staff' ? 'Loan It Financing' : esc(m.authorName || 'You')} · ${esc(when(m.createdAt))}</div>
          <div class="body">${esc(m.body)}</div>
        </div>`).join('');
      renderList();
    }

    $('ticket-list').addEventListener('click', e => {
      const btn = e.target.closest('.tkt');
      if (btn) openTicket(btn.dataset.id);
    });
    $('new-btn').addEventListener('click', showNew);
    $('back-btn').addEventListener('click', showNew);

    $('send-btn').addEventListener('click', async () => {
      const subject = $('subject').value.trim();
      const message = $('message').value.trim();
      if (!subject || !message) { $('new-status').textContent = 'A summary and a message are both needed.'; return; }
      $('send-btn').disabled = true;
      $('new-status').textContent = 'Sending…';
      try {
        const res = await window.userAuth.fetch('/api/tickets', {
          method: 'POST',
          body: JSON.stringify({ subject, message, priority: $('priority').value,
            ...(aboutType && aboutId ? { about: { type: aboutType, id: aboutId } } : {}) })
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Could not open the ticket.');
        $('subject').value = ''; $('message').value = '';
        $('new-status').textContent = '';
        await load();
        await openTicket(json.ticket.id);
      } catch (err) {
        $('new-status').textContent = err.message;
      } finally {
        $('send-btn').disabled = false;
      }
    });

    $('reply-btn').addEventListener('click', async () => {
      const message = $('reply').value.trim();
      if (!message || !openId) return;
      $('reply-btn').disabled = true;
      $('thread-status').textContent = 'Sending…';
      try {
        const res = await window.userAuth.fetch('/api/tickets/' + encodeURIComponent(openId) + '/messages', {
          method: 'POST', body: JSON.stringify({ message })
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Could not send that.');
        $('reply').value = '';
        $('thread-status').textContent = '';
        await load();
        await openTicket(openId);
      } catch (err) {
        $('thread-status').textContent = err.message;
      } finally {
        $('reply-btn').disabled = false;
      }
    });

    $('signin-btn').addEventListener('click', async () => {
      $('signin-status').textContent = '';
      try { await window.userAuth.signIn(); }
      catch (err) { $('signin-status').textContent = err.message || 'Sign-in failed.'; }
    });

    function paint(me) {
      $('signed-out').hidden = !!me;
      $('signed-in').hidden = !me;
      $('who').innerHTML = me
        ? `${esc(me.name || me.email)} <button class="btn ghost" id="out-btn" style="padding:5px 10px;">Sign out</button>`
        : '';
      const out = $('out-btn');
      if (out) out.addEventListener('click', () => window.userAuth.signOut());
      if (me) { showNew(); load(); }
    }

    window.addEventListener('user-auth', e => paint(e.detail));
    window.userAuth.ready().then(paint);
  </script>
</body>
</html>
